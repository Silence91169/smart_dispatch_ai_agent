[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smart-dispatch"
version = "0.1.0"
description = "Smart City Dynamic Dispatch Grid — agentic emergency response system"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "python-dotenv",
    "groq",
    "anthropic",
    "openai",
    "httpx",
    "faker>=30.0",
    "rich",
    "networkx>=3.2",
    "sqlalchemy>=2.0",
    "aiosqlite",
    "geopy",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    "numpy>=1.26",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langgraph>=0.2",
    "websockets>=13",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
    "ruff",
    "httpx",
]

[tool.hatch.build.targets.wheel]
packages = ["src/smart_dispatch"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "integration: marks tests that require real LLM API keys (deselect with -m 'not integration')",
    "slow: marks tests that load embedding models and run slowly",
]

[tool.ruff]
line-length = 100
target-version = "py311"
