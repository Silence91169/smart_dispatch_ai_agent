[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smart-dispatch"
version = "0.1.0"
description = "Smart City Dynamic Dispatch Grid — agentic emergency response system"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "python-dotenv",
    "groq",
    "anthropic",
    "openai",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/smart_dispatch"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
