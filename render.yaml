services:
  - type: web
    name: smart-dispatch-api
    runtime: python
    buildCommand: pip install -e .
    startCommand: uvicorn smart_dispatch.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: src
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: DB_PATH
        value: sqlite+aiosqlite:///./dispatch.db
      - key: LOG_LEVEL
        value: INFO
    plan: starter
